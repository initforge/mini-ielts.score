# Nginx configuration for mini-ielts-score
# Đặt file này tại: /etc/nginx/sites-available/mini-ielts-score

upstream node_backend {
    # Load balancing giữa các PM2 instances
    # PM2 cluster mode tự động share port 3000, chỉ cần 1 entry
    least_conn; # Chọn server có ít connections nhất
    server 127.0.0.1:3000;
    keepalive 64;
}

# Rate limiting để chống abuse
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

server {
    listen 80 default_server;
    server_name 165.22.246.35 _; # IP của Droplet, _ để catch-all
    
    # Logs
    access_log /var/log/nginx/mini-ielts-access.log;
    error_log /var/log/nginx/mini-ielts-error.log;

    # Max upload size (cho file audio/image)
    client_max_body_size 50M;
    client_body_timeout 60s;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # API routes với rate limiting
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        
        proxy_pass http://node_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts cho API calls dài (Gemini API có thể mất thời gian)
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Static files (cached)
    location /assets/ {
        limit_req zone=general_limit burst=50 nodelay;
        
        alias /var/www/mini-ielts-score/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health check
    location /health {
        proxy_pass http://node_backend;
        access_log off;
    }

    # Main app (React SPA)
    location / {
        limit_req zone=general_limit burst=50 nodelay;
        
        proxy_pass http://node_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}


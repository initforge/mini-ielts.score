# Nginx configuration — S7 verified: anish-toeic-web-services Express :7000 + anish frontend static
# VPS target: /etc/nginx/sites-available/webinprogress.click  (deploy via scripts/deploy.sh / docs/05-runbook.md)
# Edge topology: Cloudflare DNS + CDN + TLS (proxy mode) in front; Nginx on VPS terminates origin TLS.
#
# S7 changes (2026-07-31, in-place, no deploy):
#  1. Security headers moved to server level so /api, /assets, /health all inherit them
#     (previously only `location /` had them).
#  2. `server_tokens off` — hide nginx version.
#  3. `map $http_upgrade $connection_upgrade` — proper WebSocket upgrade handling
#     while keeping HTTP/1.1 keepalive to the Node upstream on normal requests
#     (previously `Connection 'upgrade'` was always sent, defeating upstream keepalive).
#  4. `location = /api { return 308 /api/; }` — bare /api would otherwise fall through
#     to the SPA fallback and serve index.html.
#  5. gzip_types extended with image/svg+xml and application/wasm (Vite asset types).
#  6. Header now documents why each block exists.

# WebSocket / keepalive upgrade map
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream node_backend {
    # PM2 fork mode on port 7000 — single instance entry (see ecosystem.config.cjs)
    server 127.0.0.1:7000;
    keepalive 64;
}

# Rate limiting để chống abuse
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

# HTTPS server block (origin TLS; Cloudflare proxy mode sits in front)
server {
    listen 443 ssl http2;
    server_name webinprogress.click www.webinprogress.click 165.22.246.35;

    # SSL certificates — Cloudflare Origin Certificate (15y, full-strict) or Certbot
    ssl_certificate /etc/letsencrypt/live/webinprogress.click/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webinprogress.click/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Logs
    access_log /var/log/nginx/anish-toeic-access.log;
    error_log /var/log/nginx/anish-toeic-error.log;

    server_tokens off;

    # Max upload size — audio/uploads go as presigned PUT directly to S3, so JSON
    # bodies here are small; 50M keeps headroom for any future direct uploads.
    client_max_body_size 50M;
    client_body_timeout 60s;

    # Gzip compression — text assets; SVG/WASM added for the Vite build
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript image/svg+xml application/wasm;

    # Security headers — server level so /api, /assets, /health, /audio all inherit
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # R2-FE (INJ-003) CSP: antd + Quill need style-src 'unsafe-inline'; scripts are
    # bundled external so 'self' suffices; media/img blob/data for audio + avatars.
    # R2-CSP (connect-src): presigned PUT uploads go to S3/Cloudinary — allow those
    # origins while keeping 'self' for the API.
    # R3-P1-MINIO: local MinIO endpoint added for the dev presigned-upload journey.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self' http://127.0.0.1:19000 https://*.amazonaws.com https://*.s3.*.amazonaws.com https://*.cloudinary.com; font-src 'self' data:; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    # R2-SEC-FIX (N2): SPA document must never be cached. Declared here at server
    # level instead of a nested `location = /index.html` add_header: any add_header
    # inside a location suppresses ALL inherited security headers (CSP/HSTS/
    # X-Frame-Options/nosniff) on that response. Now index.html inherits both the
    # security headers and no-cache. Locations that set their own add_header
    # (e.g. /assets/ immutable) are unaffected.
    add_header Cache-Control "no-cache, no-store, must-revalidate";

    # Bare /api -> canonical /api/ (prevents SPA fallback swallowing it)
    location = /api { return 308 /api/; }

    # API routes với rate limiting — reverse proxy to Express :7000
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://node_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts cho API calls dài (grading worker submission + result paths)
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Vite hashed assets — immutable cache (build output in anish-toeic-web-app/dist/assets)
    location /assets/ {
        limit_req zone=general_limit burst=50 nodelay;

        alias /var/www/mini-ielts-score/anish-toeic-web-app/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health check — rewrite to /api/health for anish-toeic-web-services
    location = /health {
        rewrite ^ /api/health break;
        proxy_pass http://node_backend;
        access_log off;
    }

    # Main app (SPA) — index.html must never be cached (fresh deploys)
    location / {
        limit_req zone=general_limit burst=50 nodelay;

        root /var/www/mini-ielts-score/anish-toeic-web-app/dist;
        try_files $uri $uri/ /index.html;
    }
}

# HTTP server block — redirect to HTTPS (TLS terminated at Cloudflare or origin)
server {
    listen 80;
    server_name webinprogress.click www.webinprogress.click 165.22.246.35;

    location / {
        return 301 https://$host$request_uri;
    }
}

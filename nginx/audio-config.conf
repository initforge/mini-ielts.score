# Nginx configuration for serving audio files
# Add this to your main nginx config file (usually in /etc/nginx/sites-available/your-site)

# Serve speaking audio files
location /audio/speaking/ {
    alias /var/www/mini-ielts-score/public/audio/speaking/;
    
    # Cache audio files for 1 year (audio files rarely change)
    add_header Cache-Control "public, max-age=31536000";
    
    # CORS headers (allow cross-origin requests)
    add_header Access-Control-Allow-Origin "*";
    add_header Access-Control-Allow-Methods "GET, OPTIONS";
    
    # MIME types for audio
    types {
        audio/mpeg mp3;
        audio/mp3 mp3;
    }
    default_type audio/mpeg;
    
    # Fallback if file doesn't exist
    try_files $uri =404;
    
    # Optional: Logging
    access_log /var/log/nginx/audio-access.log;
    error_log /var/log/nginx/audio-error.log;
}

# Optional: Handle OPTIONS requests for CORS preflight
location ~ ^/audio/speaking/.*$ {
    if ($request_method = 'OPTIONS') {
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type";
        add_header Access-Control-Max-Age "3600";
        return 204;
    }
}


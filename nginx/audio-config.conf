# Nginx OPTIONAL fragment — static speaking-audio hosting (LEGACY / convenience only)
#
# S7 note (2026-07-31): the anish-toeic web app does NOT serve speaking audio
# statically. Speaking clips are recorded in the browser and uploaded via the
# presigned-URL PUT flow (POST /api/toeic-attempts/:id/media/presign -> S3).
# This block is therefore OPTIONAL: include it only if you also host static
# audio files under public/audio/speaking/ (old prototype assets). The main
# nginx.conf (nginx/nginx.conf) does not define /audio/speaking/ anymore.
#
# S7 fix: the previous fragment used a second regex location
# (`location ~ ^/audio/speaking/.*$`) for OPTIONS. Regex locations are checked
# AFTER prefix locations and would have shadowed the serving block, so GET
# requests would never match it. OPTIONS is now handled inside the same prefix
# location via a method short-circuit.

location /audio/speaking/ {
    alias /var/www/mini-ielts-score/public/audio/speaking/;

    # CORS preflight (short-circuit before file lookup)
    if ($request_method = 'OPTIONS') {
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type";
        add_header Access-Control-Max-Age "3600";
        return 204;
    }

    # Cache audio files for 1 year (audio files rarely change)
    add_header Cache-Control "public, max-age=31536000";

    # CORS headers (allow cross-origin requests)
    add_header Access-Control-Allow-Origin "*";
    add_header Access-Control-Allow-Methods "GET, OPTIONS";

    # MIME types for audio
    types {
        audio/mpeg mp3;
        audio/mp3 mp3;
    }
    default_type audio/mpeg;

    # Fallback if file doesn't exist
    try_files $uri =404;

    # Logging
    access_log /var/log/nginx/audio-access.log;
    error_log /var/log/nginx/audio-error.log;
}
